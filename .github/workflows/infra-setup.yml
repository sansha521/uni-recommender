# One-time infrastructure setup: ALB + CloudFront for HTTPS access to the AI service.
# Run this manually via workflow_dispatch. Re-running is safe — existing resources are
# detected and reused. Causes ~2 min downtime on the ECS service (delete + recreate
# required to attach a load balancer for the first time).

name: Setup ALB + CloudFront Infrastructure

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: uni-rec-cluster
  ECS_SERVICE: uni-rec-ai-service
  ECS_TASK_FAMILY: uni-rec-ai-service
  CONTAINER_NAME: ai-service
  CONTAINER_PORT: 8000
  ALB_NAME: uni-rec-alb
  ALB_SG_NAME: uni-rec-alb-sg
  ECS_SG_NAME: uni-rec-ecs-sg
  TARGET_GROUP_NAME: uni-rec-tg

permissions:
  contents: read

jobs:
  setup:
    name: Create ALB + CloudFront
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ── VPC & Subnets ──────────────────────────────────────────────────────────
      - name: Discover default VPC and public subnets
        id: vpc
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=isDefault,Values=true" \
            --query "Vpcs[0].VpcId" --output text)
          echo "vpc_id=$VPC_ID" >> "$GITHUB_OUTPUT"

          SUBNET_IDS=$(aws ec2 describe-subnets \
            --filters "Name=vpcId,Values=$VPC_ID" \
            --query "Subnets[*].SubnetId" --output text | tr '\t' ',')
          echo "subnet_ids=$SUBNET_IDS" >> "$GITHUB_OUTPUT"

          echo "VPC: $VPC_ID"
          echo "Subnets: $SUBNET_IDS"

      # ── Security Groups ────────────────────────────────────────────────────────
      - name: Create or find ALB security group
        id: alb_sg
        run: |
          SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=$ALB_SG_NAME" \
                      "Name=vpc-id,Values=${{ steps.vpc.outputs.vpc_id }}" \
            --query "SecurityGroups[0].GroupId" --output text 2>/dev/null || echo "None")

          if [ "$SG_ID" = "None" ] || [ -z "$SG_ID" ]; then
            SG_ID=$(aws ec2 create-security-group \
              --group-name "$ALB_SG_NAME" \
              --description "ALB security group for uni-rec" \
              --vpc-id "${{ steps.vpc.outputs.vpc_id }}" \
              --query "GroupId" --output text)
            aws ec2 authorize-security-group-ingress \
              --group-id "$SG_ID" --protocol tcp --port 80 --cidr 0.0.0.0/0
            echo "Created ALB SG: $SG_ID"
          else
            echo "Reusing ALB SG: $SG_ID"
          fi
          echo "sg_id=$SG_ID" >> "$GITHUB_OUTPUT"

      - name: Create or find ECS task security group
        id: ecs_sg
        run: |
          SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=$ECS_SG_NAME" \
                      "Name=vpc-id,Values=${{ steps.vpc.outputs.vpc_id }}" \
            --query "SecurityGroups[0].GroupId" --output text 2>/dev/null || echo "None")

          if [ "$SG_ID" = "None" ] || [ -z "$SG_ID" ]; then
            SG_ID=$(aws ec2 create-security-group \
              --group-name "$ECS_SG_NAME" \
              --description "ECS task security group for uni-rec AI service" \
              --vpc-id "${{ steps.vpc.outputs.vpc_id }}" \
              --query "GroupId" --output text)
            # Only allow traffic from the ALB SG
            aws ec2 authorize-security-group-ingress \
              --group-id "$SG_ID" \
              --protocol tcp --port "$CONTAINER_PORT" \
              --source-group "${{ steps.alb_sg.outputs.sg_id }}"
            echo "Created ECS SG: $SG_ID"
          else
            echo "Reusing ECS SG: $SG_ID"
          fi
          echo "sg_id=$SG_ID" >> "$GITHUB_OUTPUT"

      # ── Target Group ───────────────────────────────────────────────────────────
      - name: Create or find target group
        id: tg
        run: |
          TG_ARN=$(aws elbv2 describe-target-groups \
            --names "$TARGET_GROUP_NAME" \
            --query "TargetGroups[0].TargetGroupArn" --output text 2>/dev/null || echo "None")

          if [ "$TG_ARN" = "None" ] || [ -z "$TG_ARN" ]; then
            TG_ARN=$(aws elbv2 create-target-group \
              --name "$TARGET_GROUP_NAME" \
              --protocol HTTP \
              --port "$CONTAINER_PORT" \
              --vpc-id "${{ steps.vpc.outputs.vpc_id }}" \
              --target-type ip \
              --health-check-protocol HTTP \
              --health-check-path /health \
              --health-check-interval-seconds 30 \
              --healthy-threshold-count 2 \
              --unhealthy-threshold-count 3 \
              --matcher HttpCode=200 \
              --query "TargetGroups[0].TargetGroupArn" --output text)
            echo "Created target group: $TG_ARN"
          else
            echo "Reusing target group: $TG_ARN"
          fi
          echo "arn=$TG_ARN" >> "$GITHUB_OUTPUT"

      # ── ALB ───────────────────────────────────────────────────────────────────
      - name: Create or find ALB
        id: alb
        run: |
          ALB_ARN=$(aws elbv2 describe-load-balancers \
            --names "$ALB_NAME" \
            --query "LoadBalancers[0].LoadBalancerArn" --output text 2>/dev/null || echo "None")

          if [ "$ALB_ARN" = "None" ] || [ -z "$ALB_ARN" ]; then
            ALB_ARN=$(aws elbv2 create-load-balancer \
              --name "$ALB_NAME" \
              --subnets $(echo "${{ steps.vpc.outputs.subnet_ids }}" | tr ',' ' ') \
              --security-groups "${{ steps.alb_sg.outputs.sg_id }}" \
              --scheme internet-facing \
              --type application \
              --ip-address-type ipv4 \
              --query "LoadBalancers[0].LoadBalancerArn" --output text)
            echo "Created ALB: $ALB_ARN"

            # Add HTTP listener
            aws elbv2 create-listener \
              --load-balancer-arn "$ALB_ARN" \
              --protocol HTTP --port 80 \
              --default-actions "Type=forward,TargetGroupArn=${{ steps.tg.outputs.arn }}"
          else
            echo "Reusing ALB: $ALB_ARN"
          fi

          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --load-balancer-arns "$ALB_ARN" \
            --query "LoadBalancers[0].DNSName" --output text)

          echo "arn=$ALB_ARN" >> "$GITHUB_OUTPUT"
          echo "dns=$ALB_DNS" >> "$GITHUB_OUTPUT"
          echo "ALB DNS: $ALB_DNS"

      # ── ECS Service Recreation ─────────────────────────────────────────────────
      # AWS does not allow attaching a load balancer to an existing ECS service.
      # We must delete and recreate. This causes ~2 min downtime.
      - name: Check if ECS service already has a load balancer
        id: svc_check
        run: |
          LB_COUNT=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query "length(services[0].loadBalancers)" --output text 2>/dev/null || echo "0")
          echo "lb_count=$LB_COUNT" >> "$GITHUB_OUTPUT"
          echo "Load balancers on current service: $LB_COUNT"

      - name: Delete ECS service (if no load balancer attached yet)
        if: steps.svc_check.outputs.lb_count == '0'
        run: |
          aws ecs delete-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force
          echo "Waiting for service to drain..."
          aws ecs wait services-inactive \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      - name: Get latest active task definition ARN
        id: taskdef
        run: |
          TD_ARN=$(aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query "taskDefinition.taskDefinitionArn" --output text)
          echo "arn=$TD_ARN" >> "$GITHUB_OUTPUT"
          echo "Task definition: $TD_ARN"

      - name: Recreate ECS service with ALB target group
        if: steps.svc_check.outputs.lb_count == '0'
        run: |
          SUBNETS=$(echo "${{ steps.vpc.outputs.subnet_ids }}" | tr ',' ' ' | \
            awk '{for(i=1;i<=NF;i++) printf "\"%s\",", $i}' | sed 's/,$//')

          aws ecs create-service \
            --cluster "$ECS_CLUSTER" \
            --service-name "$ECS_SERVICE" \
            --task-definition "${{ steps.taskdef.outputs.arn }}" \
            --desired-count 1 \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[\"${{ steps.ecs_sg.outputs.sg_id }}\"],assignPublicIp=ENABLED}" \
            --load-balancers "targetGroupArn=${{ steps.tg.outputs.arn }},containerName=$CONTAINER_NAME,containerPort=$CONTAINER_PORT" \
            --health-check-grace-period-seconds 120

          echo "Waiting for service to stabilize..."
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      # ── CloudFront ────────────────────────────────────────────────────────────
      - name: Check for existing CloudFront distribution
        id: cf_check
        run: |
          # Match on ALB DNS as the origin domain
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Origins.Items[0].DomainName=='${{ steps.alb.outputs.dns }}'].Id | [0]" \
            --output text 2>/dev/null || echo "None")
          echo "dist_id=$DIST_ID" >> "$GITHUB_OUTPUT"
          echo "Existing CloudFront distribution: $DIST_ID"

      - name: Create CloudFront distribution
        id: cf
        if: steps.cf_check.outputs.dist_id == 'None' || steps.cf_check.outputs.dist_id == ''
        run: |
          ALB_DNS="${{ steps.alb.outputs.dns }}"
          CALLER_REF="uni-rec-$(date +%s)"

          DIST_DOMAIN=$(aws cloudfront create-distribution \
            --distribution-config "{
              \"CallerReference\": \"$CALLER_REF\",
              \"Comment\": \"HTTPS front for uni-rec AI service ALB\",
              \"Enabled\": true,
              \"Origins\": {
                \"Quantity\": 1,
                \"Items\": [{
                  \"Id\": \"alb-origin\",
                  \"DomainName\": \"$ALB_DNS\",
                  \"CustomOriginConfig\": {
                    \"HTTPPort\": 80,
                    \"HTTPSPort\": 443,
                    \"OriginProtocolPolicy\": \"http-only\",
                    \"OriginSSLProtocols\": {\"Quantity\": 1, \"Items\": [\"TLSv1.2\"]}
                  }
                }]
              },
              \"DefaultCacheBehavior\": {
                \"TargetOriginId\": \"alb-origin\",
                \"ViewerProtocolPolicy\": \"redirect-to-https\",
                \"CachePolicyId\": \"4135ea2d-6df8-44a3-9df3-4b5a84be39ad\",
                \"AllowedMethods\": {
                  \"Quantity\": 7,
                  \"Items\": [\"GET\",\"HEAD\",\"OPTIONS\",\"PUT\",\"POST\",\"PATCH\",\"DELETE\"],
                  \"CachedMethods\": {\"Quantity\": 2, \"Items\": [\"GET\",\"HEAD\"]}
                },
                \"OriginRequestPolicyId\": \"216adef6-5c7f-47e4-b989-5492eafa07d3\",
                \"Compress\": false
              },
              \"PriceClass\": \"PriceClass_100\"
            }" \
            --query "Distribution.DomainName" --output text)

          echo "domain=$DIST_DOMAIN" >> "$GITHUB_OUTPUT"

      - name: Resolve CloudFront domain (if already existed)
        if: steps.cf_check.outputs.dist_id != 'None' && steps.cf_check.outputs.dist_id != ''
        id: cf_existing
        run: |
          DIST_DOMAIN=$(aws cloudfront get-distribution \
            --id "${{ steps.cf_check.outputs.dist_id }}" \
            --query "Distribution.DomainName" --output text)
          echo "domain=$DIST_DOMAIN" >> "$GITHUB_OUTPUT"

      # ── Summary ───────────────────────────────────────────────────────────────
      - name: Print endpoints
        run: |
          CF_DOMAIN="${{ steps.cf.outputs.domain }}${{ steps.cf_existing.outputs.domain }}"
          echo ""
          echo "================================================"
          echo "  ALB (HTTP only, internal):  http://${{ steps.alb.outputs.dns }}"
          echo "  CloudFront (HTTPS):         https://$CF_DOMAIN"
          echo "================================================"
          echo ""
          echo "NOTE: CloudFront takes 5–15 min to fully deploy."
          echo "Test with:  curl https://$CF_DOMAIN/health"
